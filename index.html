<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />

<meta name="theme-color" content="#05060c" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" />
<title>New Sites AI Brain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --gold:#D4AF37; --gold-bright:#F2D479; --gold-deep:#8a6d1f; --ink:#04050a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html { background-color:#05060c !important; background-image:radial-gradient(ellipse at 50% 28%, #0b0d18 0%, #05060c 55%, #020308 100%); scroll-behavior:smooth; }
  body { min-height:100%; background:transparent; font-family:'Manrope',sans-serif; color:#f4ecd2; -webkit-font-smoothing:antialiased; overflow-x:hidden; }
  ::-webkit-scrollbar { width:8px; } ::-webkit-scrollbar-track { background:#060606; } ::-webkit-scrollbar-thumb { background:rgba(212,175,55,0.3); border-radius:4px; } ::-webkit-scrollbar-thumb:hover { background:rgba(212,175,55,0.6); }

  #webgl-canvas { position:fixed; top:0; left:0; width:100vw; height:100vh; height:100dvh; display:block; z-index:-1; touch-action:none; }
  .atmosphere { position:fixed; inset:0; z-index:0; pointer-events:none; background:radial-gradient(circle at 50% 42%, rgba(212,175,55,0.10) 0%, rgba(212,175,55,0) 42%), radial-gradient(circle at 50% 50%, transparent 62%, rgba(0,0,0,0.5) 100%); mix-blend-mode:screen; }
  .grain { position:fixed; inset:-50%; z-index:0; pointer-events:none; opacity:0.05; background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); animation:grainShift 6s steps(6) infinite; }
  @keyframes grainShift { 0%{transform:translate(0,0)} 50%{transform:translate(-4%,3%)} 100%{transform:translate(2%,-2%)} }
